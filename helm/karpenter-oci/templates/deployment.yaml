apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karpenter-oci.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-oci.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "karpenter-oci.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "karpenter-oci.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "karpenter-oci.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "karpenter-oci.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --v={{ .Values.settings.logLevel }}
            - --config=/config/settings
          env:
            {{- with .Values.controller.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: CLUSTER_NAME
              value: {{ required "settings.clusterName is required" .Values.settings.clusterName }}
            {{- if .Values.oci.existingSecret }}
            # Use values from existing secret (e.g., SealedSecret)
            {{- if .Values.oci.existingSecretConfigKey }}
            # Mount config file from secret and read it
            - name: OCI_CONFIG_FILE
              value: /etc/oci-secret/{{ .Values.oci.existingSecretConfigKey }}
            {{- else }}
            # Read individual keys from secret
            - name: OCI_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: region
            - name: OCI_COMPARTMENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: compartmentId
            - name: OCI_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: clusterId
            - name: OCI_SUBNET_IDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: subnetIds
            - name: OCI_IMAGE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: imageId
                  optional: true
            - name: OCI_USE_INSTANCE_PRINCIPAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: useInstancePrincipal
            - name: ENABLE_OCI_DYNAMIC_SHAPES
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oci.existingSecret }}
                  key: enableDynamicShapes
            {{- end }}
            {{- else }}
            # Use values directly from Helm values (not recommended for production)
            - name: OCI_REGION
              value: {{ required "oci.region is required" .Values.oci.region }}
            - name: OCI_COMPARTMENT_ID
              value: {{ required "oci.compartmentId is required" .Values.oci.compartmentId }}
            - name: OCI_CLUSTER_ID
              value: {{ required "oci.clusterId is required" .Values.oci.clusterId }}
            {{- if .Values.oci.subnetIds }}
            - name: OCI_SUBNET_IDS
              value: {{ join "," .Values.oci.subnetIds }}
            {{- end }}
            {{- if .Values.oci.imageId }}
            - name: OCI_IMAGE_ID
              value: {{ .Values.oci.imageId }}
            {{- end }}
            - name: OCI_USE_INSTANCE_PRINCIPAL
              value: {{ .Values.oci.useInstancePrincipal | quote }}
            - name: ENABLE_OCI_DYNAMIC_SHAPES
              value: {{ .Values.oci.enableDynamicShapes | quote }}
            {{- end }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: webhook-metrics
              containerPort: {{ .Values.webhook.metricsPort }}
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if and .Values.oci.existingSecret .Values.oci.existingSecretConfigKey }}
            - name: oci-secret
              mountPath: /etc/oci-secret
              readOnly: true
            {{- end }}
            {{- with .Values.controller.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "karpenter-oci.fullname" . }}-settings
        {{- if and .Values.oci.existingSecret .Values.oci.existingSecretConfigKey }}
        - name: oci-secret
          secret:
            secretName: {{ .Values.oci.existingSecret }}
        {{- end }}
        {{- with .Values.controller.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      nodeSelector:
        node_pool: generic
        {{- range $key, $value := .Values.nodeSelector }}
        {{- if ne $key "node_pool" }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Always include node_pool toleration for generic nodes
        - key: node_pool
          operator: Equal
          value: generic
          effect: NoSchedule
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}