# Example template for creating a SealedSecret with OCI configuration
# 
# Usage:
# 1. Copy this file and update with your actual values
# 2. Create the secret: kubectl create secret generic karpenter-oci-config --from-file=oci-config.yaml --dry-run=client -o yaml > secret.yaml
# 3. Seal it: kubeseal --format=yaml < secret.yaml > sealed-secret.yaml
# 4. Apply the sealed secret to your cluster

apiVersion: v1
kind: Secret
metadata:
  name: karpenter-oci-config
  namespace: karpenter
type: Opaque
stringData:
  # OCI Region (e.g., us-ashburn-1, us-phoenix-1, eu-frankfurt-1)
  region: "us-ashburn-1"
  
  # OCI Compartment OCID where instances will be created
  compartmentId: "ocid1.compartment.oc1..aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  
  # OKE Cluster OCID
  clusterId: "ocid1.cluster.oc1.iad.aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  
  # Subnet OCIDs (comma-separated list)
  # These should be the worker node subnets in your OKE cluster
  subnetIds: "ocid1.subnet.oc1.iad.aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX,ocid1.subnet.oc1.iad.aaaaaaaaBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
  
  # Default OKE node pool image OCID (optional)
  # If not specified, Karpenter will use the latest OKE image
  imageId: "ocid1.image.oc1.iad.aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  
  # Use instance principal for authentication (recommended for OKE)
  useInstancePrincipal: "true"
  
  # Enable OCI flexible shapes (VM.Standard.E4.Flex, VM.Standard.A1.Flex, etc.)
  enableDynamicShapes: "true"

---
# Example of the resulting SealedSecret (after using kubeseal)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: karpenter-oci-config
  namespace: karpenter
spec:
  encryptedData:
    region: "AgC..."  # These will be encrypted values
    compartmentId: "AgC..."
    clusterId: "AgC..."
    subnetIds: "AgC..."
    imageId: "AgC..."
    useInstancePrincipal: "AgC..."
    enableDynamicShapes: "AgC..."
  template:
    metadata:
      name: karpenter-oci-config
      namespace: karpenter
    type: Opaque