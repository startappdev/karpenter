apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: production-pool
  namespace: karpenter
spec:
  # Template for Production workloads  
  template:
    metadata:
      labels:
        node_pool: start_io_dsp_rtb
        workload-type: production
        cost-optimization: enabled
      annotations:
        karpenter.sh/nodepool-type: "production-workloads"
    spec:
      # Architecture and OS requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Ensure larger flexible shapes for high-resource production workloads
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["VM.Standard.E4.Flex", "VM.Standard.E5.Flex"]
        # Force larger flexible shapes by requiring minimum CPU capacity
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      
      # Production-specific taints for workload isolation
      taints:
        - key: node_pool
          value: start_io_dsp_rtb
          effect: NoSchedule
      
      # Reference to OCI NodeClass
      nodeClassRef:
        group: karpenter.sh
        kind: OCINodeClass
        name: default
      
      # Longer expiration for production stability
      expireAfter: 72h
  
  # COST REDUCTION: Scale down to 0 nodes
  limits:
    cpu: "0"      # Scale down to 0 nodes
    memory: "0Gi" # Scale down to 0 nodes
  
  # COST REDUCTION: Enable aggressive consolidation to terminate all nodes
  disruption:
    consolidationPolicy: WhenEmpty  # Consolidate empty nodes
    consolidateAfter: 1s  # Immediately consolidate
    budgets:
      - nodes: "100%"   # Allow all nodes to be terminated