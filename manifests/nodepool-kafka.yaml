apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kafka-pool
  namespace: karpenter
spec:
  # Template for Kafka workloads
  template:
    metadata:
      labels:
        node_pool: kafka
        workload-type: kafka
        cost-optimization: enabled
      annotations:
        karpenter.sh/nodepool-type: "kafka-workloads"
    spec:
      # Architecture and OS requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Cost-effective shapes are automatically selected by OCI provider
      
      # Kafka-specific taints for workload isolation
      taints:
        - key: kafka
          effect: NoSchedule
      
      # Reference to OCI NodeClass
      nodeClassRef:
        group: karpenter.sh
        kind: OCINodeClass  
        name: default
      
      # Reasonable expiration for cost optimization
      expireAfter: 24h
  
  # No resource limits - let OCI cost optimization handle shape selection
  # limits:
  #   cpu: "1000"     # Remove limits to allow OCI provider shape selection 
  #   memory: "4000Gi" # Let cost-optimized shapes be selected dynamically
  
  # Disruption settings for cost optimization
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"