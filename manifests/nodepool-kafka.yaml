apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kafka-pool
  namespace: karpenter
spec:
  # Template for Kafka workloads
  template:
    metadata:
      labels:
        node_pool: kafka
        workload-type: kafka
        cost-optimization: enabled
      annotations:
        karpenter.sh/nodepool-type: "kafka-workloads"
    spec:
      # Architecture and OS requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Cost-effective shapes are automatically selected by OCI provider
      
      # Kafka-specific taints for workload isolation
      taints:
        - key: kafka
          value: "true"
          effect: NoSchedule
      
      # Reference to OCI NodeClass
      nodeClassRef:
        group: karpenter.sh
        kind: OCINodeClass  
        name: default
      
      # Reasonable expiration for cost optimization
      expireAfter: 24h
  
  # COST REDUCTION: Scale down to 0 nodes
  limits:
    cpu: "0"      # Scale down to 0 nodes
    memory: "0Gi" # Scale down to 0 nodes
  
  # COST REDUCTION: Enable aggressive consolidation to terminate all nodes
  disruption:
    consolidationPolicy: WhenEmpty  # Consolidate empty nodes
    consolidateAfter: 1s  # Immediately consolidate
    budgets:
      - nodes: "100%"   # Allow all nodes to be terminated