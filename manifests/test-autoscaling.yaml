apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
  namespace: karpenter-test
spec:
  replicas: 0  # Start with 0, will scale up to test
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      # Tolerate the Karpenter test taint
      tolerations:
        - key: karpenter-test
          value: "true"
          effect: NoSchedule
      # Force scheduling on Karpenter nodes
      nodeSelector:
        karpenter.sh/nodepool: oci-flexible-pool
      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - inflate
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: inflate
  namespace: karpenter-test
spec:
  selector:
    app: inflate
  ports:
    - port: 80
      targetPort: 80