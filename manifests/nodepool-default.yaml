apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default-pool
  namespace: karpenter
spec:
  # Template for Default/Test workloads
  template:
    metadata:
      labels:
        shape-family: e5
        node-type: flexible-e5
        workload-type: default
        cost-optimization: enabled
      annotations:
        karpenter.sh/nodepool-type: "default-workloads"
    spec:
      # Architecture and OS requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Cost-effective shapes are automatically selected by OCI provider
      
      # Default workload taints for isolation
      taints:
        - key: node-type
          value: flexible-e5
          effect: NoSchedule
      
      # Reference to OCI NodeClass
      nodeClassRef:
        group: karpenter.sh
        kind: OCINodeClass
        name: default
      
      # Short expiration for cost optimization in test environments
      expireAfter: 12h
  
  # COST REDUCTION: Scale down to 0 nodes
  limits:
    cpu: "0"      # Scale down to 0 nodes
    memory: "0Gi" # Scale down to 0 nodes
  
  # COST REDUCTION: Enable aggressive consolidation to terminate all nodes
  disruption:
    consolidationPolicy: WhenEmpty  # Consolidate empty nodes
    consolidateAfter: 1s  # Immediately consolidate
    budgets:
      - nodes: "100%"   # Allow all nodes to be terminated