apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: flexible-pool
  namespace: karpenter
spec:
  # Template for nodes created by this NodePool
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: flexible-pool
        node-type: karpenter-managed
      annotations:
        # Annotations for OCI instances
        oci.oraclecloud.com/managed-by: karpenter
    spec:
      # Requirements for node provisioning
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            # OCI Flexible shapes
            - VM.Standard3.Flex
            - VM.Standard.E4.Flex
            - VM.Standard.E5.Flex
            - VM.Optimized3.Flex
      # OCI-specific instance configuration
      instanceTypes:
        # Define flexible shape configurations
        - name: VM.Standard3.Flex
          minCPU: 1
          maxCPU: 32
          minMemoryGb: 1
          maxMemoryGb: 512
        - name: VM.Standard.E4.Flex
          minCPU: 1
          maxCPU: 64
          minMemoryGb: 1
          maxMemoryGb: 1024
        - name: VM.Standard.E5.Flex
          minCPU: 1
          maxCPU: 94
          minMemoryGb: 1
          maxMemoryGb: 1408
        - name: VM.Optimized3.Flex
          minCPU: 1
          maxCPU: 18
          minMemoryGb: 1
          maxMemoryGb: 256
      # Node properties
      taints:
        - key: karpenter.sh/nodepool
          value: flexible-pool
          effect: NoSchedule
      startupTaints:
        # Taint nodes while they're initializing
        - key: node.karpenter.sh/initializing
          value: "true"
          effect: NoSchedule
      # User data for node initialization
      userData: |
        #!/bin/bash
        /etc/eks/bootstrap.sh ${CLUSTER_NAME}
        echo "Node initialized by Karpenter" > /var/log/karpenter-init.log
  # Disruption settings
  disruption:
    # Consolidation policy for scaling down
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    # Node expiry
    expireAfter: 24h
    # Budget for disruptions
    budgets:
      - nodes: "33%"
  # Limits for the NodePool
  limits:
    cpu: "1000"
    memory: "4000Gi"
  # Weight for scheduling preference
  weight: 10
---
apiVersion: karpenter.sh/v1
kind: EC2NodeClass
metadata:
  name: flexible-nodeclass
  namespace: karpenter
spec:
  # OCI-specific configuration
  compartmentID: "${OCI_COMPARTMENT_ID}"
  imageID: "${OCI_IMAGE_ID}"
  subnetIDs:
    - "${OCI_SUBNET_ID_1}"
    - "${OCI_SUBNET_ID_2}"
  securityGroupIDs:
    - "${OCI_SECURITY_GROUP_ID}"
  # Instance configuration
  instanceStorePolicy: RAID0
  # SSH key for debugging (optional)
  keyName: "${OCI_SSH_KEY_NAME}"
  # Node metadata options
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "100Gi"
        volumeType: "gp3"
        deleteOnTermination: true
        encrypted: true
  # Tags for OCI resources
  tags:
    Environment: test
    ManagedBy: karpenter
    NodePool: flexible-pool