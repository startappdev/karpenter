apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: karpenter-oci-nodeclass
rules:
- apiGroups:
  - karpenter.sh
  resources:
  - ocinodeclasses
  - ocinodeclasses/status
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: karpenter-oci-nodeclass
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: karpenter-oci-nodeclass
subjects:
- kind: ServiceAccount
  name: karpenter
  namespace: karpenter