# Add this file to your FluxCD repository to deploy Karpenter tests
# Path: clusters/your-cluster/karpenter/karpenter-test.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-test
---
# ConfigMap with test manifests
apiVersion: v1
kind: ConfigMap
metadata:
  name: karpenter-test-manifests
  namespace: karpenter-test
data:
  nodepools.yaml: |
    ---
    # NodePool for E4 Flexible shapes
    apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: oci-e4-flex-pool
      namespace: karpenter
    spec:
      template:
        metadata:
          labels:
            karpenter.sh/nodepool: oci-e4-flex-pool
            node-type: flexible
            shape-family: e4
        spec:
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["amd64"]
            - key: kubernetes.io/os
              operator: In
              values: ["linux"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["on-demand"]
            - key: node.kubernetes.io/instance-type
              operator: In
              values: ["VM.Standard.E4.Flex"]
          nodeClassRef:
            kind: NodeClass
            name: oci-nodeclass
          taints:
            - key: node-type
              value: "flexible-e4"
              effect: NoSchedule
      disruption:
        consolidationPolicy: WhenUnderutilized
        consolidateAfter: 30s
        budgets:
          - nodes: "10%"
      limits:
        cpu: "1000"
        memory: "1000Gi"
      weight: 100
    ---
    # NodePool for E5 Flexible shapes
    apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: oci-e5-flex-pool
      namespace: karpenter
    spec:
      template:
        metadata:
          labels:
            karpenter.sh/nodepool: oci-e5-flex-pool
            node-type: flexible
            shape-family: e5
        spec:
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["amd64"]
            - key: kubernetes.io/os
              operator: In
              values: ["linux"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["on-demand"]
            - key: node.kubernetes.io/instance-type
              operator: In
              values: ["VM.Standard.E5.Flex"]
          nodeClassRef:
            kind: NodeClass
            name: oci-nodeclass
          taints:
            - key: node-type
              value: "flexible-e5"
              effect: NoSchedule
      disruption:
        consolidationPolicy: WhenUnderutilized
        consolidateAfter: 30s
        budgets:
          - nodes: "10%"
      limits:
        cpu: "2000"
        memory: "2000Gi"
      weight: 150
    ---
    # NodeClass for OCI
    apiVersion: karpenter.k8s.aws/v1beta1
    kind: NodeClass
    metadata:
      name: oci-nodeclass
      namespace: karpenter
    spec:
      instanceStorePolicy: RAID0
      userData: |
        #!/bin/bash
        echo "Initializing OCI Karpenter node"
      metadataOptions:
        httpEndpoint: enabled
        httpProtocolIPv6: disabled
        httpPutResponseHopLimit: 2
        httpTokens: required
---
# Kustomization to apply NodePools
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karpenter-nodepools
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: karpenter
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/your-cluster/karpenter
  prune: true
  postBuild:
    substitute:
      nodepool_config: |
        # E4 Flex NodePool
        ---
        apiVersion: karpenter.sh/v1
        kind: NodePool
        metadata:
          name: oci-e4-flex-pool
          namespace: karpenter
        spec:
          template:
            metadata:
              labels:
                karpenter.sh/nodepool: oci-e4-flex-pool
                node-type: flexible
                shape-family: e4
            spec:
              requirements:
                - key: kubernetes.io/arch
                  operator: In
                  values: ["amd64"]
                - key: kubernetes.io/os
                  operator: In
                  values: ["linux"]
                - key: karpenter.sh/capacity-type
                  operator: In
                  values: ["on-demand"]
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values: ["VM.Standard.E4.Flex"]
              nodeClassRef:
                kind: NodeClass
                name: oci-nodeclass
              taints:
                - key: node-type
                  value: "flexible-e4"
                  effect: NoSchedule
          disruption:
            consolidationPolicy: WhenUnderutilized
            consolidateAfter: 30s
            budgets:
              - nodes: "10%"
          limits:
            cpu: "1000"
            memory: "1000Gi"
          weight: 100
---
# Test workloads
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-e4-flex-app
  namespace: karpenter-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-e4-flex
  template:
    metadata:
      labels:
        app: test-e4-flex
    spec:
      tolerations:
        - key: node-type
          operator: Equal
          value: flexible-e4
          effect: NoSchedule
      nodeSelector:
        shape-family: e4
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args: ["--cpu", "2", "--vm", "1", "--vm-bytes", "2G", "--timeout", "86400s"]
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-e5-flex-app
  namespace: karpenter-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-e5-flex
  template:
    metadata:
      labels:
        app: test-e5-flex
    spec:
      tolerations:
        - key: node-type
          operator: Equal
          value: flexible-e5
          effect: NoSchedule
      nodeSelector:
        shape-family: e5
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args: ["--cpu", "8", "--vm", "2", "--vm-bytes", "8G", "--timeout", "86400s"]
          resources:
            requests:
              cpu: "8"
              memory: "16Gi"
            limits:
              cpu: "16"
              memory: "32Gi"