apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: karpenter
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./helm/karpenter-oci
      sourceRef:
        kind: GitRepository
        name: karpenter
      version: "0.1.9"
  values:
    image:
      repository: ghcr.io/startappdev/karpenter
      tag: "start-io-1da0394"
    
    # Reference the existing sealed secret for OCI config
    oci:
      existingSecret: "oci-config"
    
    # Node selector and tolerations
    nodeSelector:
      node_pool: generic
    
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node_pool
        operator: Equal
        value: generic
        effect: NoSchedule
---
# This SealedSecret should be in your FluxCD repository
# Create it using: scripts/create-oci-sealed-secret.sh
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oci-config
  namespace: karpenter
spec:
  encryptedData:
    # These will be populated by the create-oci-sealed-secret.sh script
    region: # encrypted value
    compartmentId: # encrypted value
    clusterId: # encrypted value
    subnetIds: # encrypted value
    imageId: # encrypted value
    clusterName: # encrypted value
    useInstancePrincipal: # encrypted value
  template:
    metadata:
      name: oci-config
      namespace: karpenter
    type: Opaque