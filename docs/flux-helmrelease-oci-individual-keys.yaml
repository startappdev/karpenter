apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: karpenter
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./helm/karpenter-oci
      sourceRef:
        kind: GitRepository
        name: karpenter
      version: "0.1.9"
  values:
    image:
      repository: ghcr.io/startappdev/karpenter
      tag: "start-io-1da0394"
    
    # Reference the sealed secret with individual keys
    oci:
      existingSecret: "oci-config-new"
      # Leave existingSecretConfigKey empty to use individual keys
      existingSecretConfigKey: ""
    
    # settings.clusterName is still required by the Helm template
    settings:
      clusterName: "oke-cluster"  # This will also be read from secret
      logLevel: info
      batchMaxDuration: 10s
      batchIdleDuration: 1s
      featureGates:
        dynamicProvisioning: true
        drift: true
        spotInterruption: true
    
    # Node selector and tolerations
    nodeSelector:
      node_pool: generic
    
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node_pool
        operator: Equal
        value: generic
        effect: NoSchedule
---
# Add this SealedSecret to your FluxCD repository
# It contains all the required OCI configuration values as individual keys
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oci-config-new
  namespace: karpenter
spec:
  encryptedData:
    clusterId: 
    clusterName: 
    compartmentId: 
    enableDynamicShapes: 
    imageId: 
    region: 
    subnetIds: 
    useInstancePrincipal: 
  template:
    metadata:
      name: oci-config-new
      namespace: karpenter