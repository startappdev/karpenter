apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: karpenter
  releaseName: karpenter-karpenter
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./helm/karpenter-oci
      sourceRef:
        kind: GitRepository
        name: karpenter
      version: "0.1.9"
  values:
    image:
      repository: ghcr.io/startappdev/karpenter
      tag: "start-io-2fb5e8d"  # Latest image with ShapeConfig fix and enhanced logging
    
    # Use the new secret that has the correct values
    oci:
      existingSecret: "oci-config-new"
    
    settings:
      clusterName: "ashburn-ops-oke-stg"
      logLevel: "debug"
    
    # Add environment variable to enable OCI SDK debug logging
    controller:
      env:
        - name: OCI_GO_SDK_DEBUG
          value: "info"
    
    serviceAccount:
      create: false
      name: karpenter
    
    # Node selector and tolerations
    nodeSelector:
      node_pool: generic
    
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node_pool
        operator: Equal
        value: generic
        effect: NoSchedule