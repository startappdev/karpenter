apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: karpenter
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./helm/karpenter-oci
      sourceRef:
        kind: GitRepository
        name: karpenter
      version: "0.1.9"
  values:
    image:
      repository: ghcr.io/startappdev/karpenter
      tag: "start-io-1da0394"
    
    # The sealed secret is now included in the Helm chart
    # and will be automatically deployed
    
    # settings.clusterName is required by the Helm template
    settings:
      clusterName: "oke-cluster"
      logLevel: info
      batchMaxDuration: 10s
      batchIdleDuration: 1s
      featureGates:
        dynamicProvisioning: true
        drift: true
        spotInterruption: true
    
    # Node selector and tolerations
    nodeSelector:
      node_pool: generic
    
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node_pool
        operator: Equal
        value: generic
        effect: NoSchedule